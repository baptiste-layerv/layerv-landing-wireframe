<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 1 - Layer V Sub-Products (top, smallest) -->
  <rect x="100" y="20" width="300" height="50" fill="white" stroke="black" stroke-width="2"/>
  <text x="250" y="50" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Layer V Sub-Products</text>
  <text x="420" y="50" text-anchor="start" font-family="Arial" font-size="12" fill="#666">Momentum Traders, Yield Seekers</text>
  
  <!-- Layer 2 - Liquidity Network -->
  <rect x="80" y="80" width="340" height="50" fill="#f5f5f5" stroke="black" stroke-width="2"/>
  <text x="250" y="110" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Liquidity Network</text>
  <text x="440" y="110" text-anchor="start" font-family="Arial" font-size="12" fill="#666">Market Makers, OTC Desk, Professional Traders</text>
  
  <!-- Layer 3 - Core Engine -->
  <rect x="60" y="140" width="360" height="50" fill="#f5f5f5" stroke="black" stroke-width="2"/>
  <text x="250" y="170" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Core Engine</text>
  <text x="440" y="170" text-anchor="start" font-family="Arial" font-size="12" fill="#666">Hybrid CLOB + RFQ, Risk Engine</text>
  
  <!-- Layer 4 - Chainlink CRE -->
  <rect x="80" y="200" width="340" height="50" fill="#f5f5f5" stroke="black" stroke-width="2"/>
  <text x="250" y="230" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Chainlink CRE</text>
  <text x="440" y="230" text-anchor="start" font-family="Arial" font-size="12" fill="#666">Verifiable execution, Orchestration</text>
  
  <!-- Layer 5 - Settlement Layer (bottom, widest) -->
  <rect x="100" y="260" width="300" height="50" fill="#f5f5f5" stroke="black" stroke-width="2"/>
  <text x="250" y="290" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Settlement Layer</text>
  <text x="420" y="290" text-anchor="start" font-family="Arial" font-size="12" fill="#666">Smart Contracts, Collateral, Tokenization</text>
</svg>